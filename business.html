<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For business — AdPe</title>
<meta name="description" content="Advertise on AdPe. Reach out to connect@zentrixai.in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#FBFBFD; color:#0A1633; min-height:100vh;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    position:sticky; top:0; z-index:50; background:rgba(251,251,253,.82);
    backdrop-filter:blur(16px); border-bottom:1px solid rgba(10,22,51,.06);
  }
  nav{max-width:1140px; margin:0 auto; padding:15px clamp(18px,4vw,28px)}
  nav img{height:30px; width:auto; display:block}
  main{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; gap:clamp(18px,3vw,28px);
    padding:clamp(48px,9vw,96px) clamp(20px,4vw,28px);
  }
  .eyebrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:13px; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; color:#5A6785;
  }
  h1{
    font-size:clamp(26px,4.4vw,44px); line-height:1.15; font-weight:800;
    letter-spacing:-.02em; text-wrap:balance; max-width:16ch;
  }
  .mail{
    display:inline-block; font-size:clamp(17px,2.4vw,23px); font-weight:700;
    color:#FFFFFF; background:#0A6FB8; padding:15px clamp(24px,3.4vw,34px);
    border-radius:999px; text-decoration:none; word-break:break-word;
    box-shadow:0 18px 40px -20px rgba(10,111,184,.6);
    transition:background .18s ease, transform .18s ease;
  }
  .mail:hover{background:#08598F; transform:translateY(-1px)}
  .note{font-size:15px; color:#5A6785; max-width:44ch; text-wrap:balance}
  footer{
    padding:26px clamp(20px,4vw,28px) 40px; text-align:center;
    font-size:14px; color:#5A6785;
  }
  footer a{color:#0A6FB8; text-decoration:none}
  footer a:hover{text-decoration:underline}
  footer .sep{margin:0 10px; opacity:.45}
  @media (max-width:420px){ .sep{display:block; height:0; overflow:hidden; margin:6px 0} }
</style>
